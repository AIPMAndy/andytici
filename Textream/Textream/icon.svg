<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Andy题词 logo 源文件（master SVG）。
       字体：STHeiti Medium（Apple 系统字体）。
       1024 master PNG 已通过 sips 生成 16/32/64/128/256/512/1024 全部尺寸，
       写入 Assets.xcassets/AppIcon.appiconset。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFD700" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="charFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <linearGradient id="charStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <clipPath id="roundedMask">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <!-- Background + glow -->
  <g clip-path="url(#roundedMask)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#centerGlow)"/>
  </g>

  <!-- "题" character (generated by ImageMagick + STHeiti Medium)
       This SVG is the design source; the actual 1024 PNG is rasterized from
       Heiti SC for character accuracy, then exported as macOS AppIcon assets. -->
  <text x="512" y="700"
        font-family="STHeiti, Heiti SC, PingFang SC, sans-serif"
        font-size="760"
        font-weight="500"
        fill="url(#charFill)"
        stroke="url(#charStroke)"
        stroke-width="6"
        text-anchor="middle">题</text>
</svg>
